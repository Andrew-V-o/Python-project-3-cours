<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мониторинг студентов</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        #status { color: gray; font-size: 12px; }
    </style>
</head>
<body>
    <h1>Мониторинг студентов в реальном времени</h1>
    <p id="status">Ожидание данных...</p>
    
    <table id="studentsTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>ФИО</th>
                <th>Средний балл</th>
                <th>Оценки</th>
            </tr>
        </thead>
        <tbody>
            <!-- Данные загрузятся сюда -->
        </tbody>
    </table>

    <script>
        async function updateTable() {
            try {
                const response = await fetch('/api/students');
                const students = await response.json();
                
                const tbody = document.querySelector('#studentsTable tbody');
                tbody.innerHTML = ''; // Очищаем таблицу
                
                students.forEach(s => {
                    const row = `<tr>
                        <td>${s.id}</td>
                        <td>${s.name}</td>
                        <td><b>${s.average.toFixed(2)}</b></td>
                        <td>${s.grades.join(', ')}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
                
                const now = new Date().toLocaleTimeString();
                document.getElementById('status').innerText = `Последнее обновление: ${now}`;
            } catch (error) {
                document.getElementById('status').innerText = 'Ошибка подключения к серверу!';
            }
        }

        // Запускаем обновление сразу и каждые 2 секунды
        updateTable();
        setInterval(updateTable, 2000);
    </script>
</body>
</html>
